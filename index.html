<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Proxy Browser</title>
<style>
:root{--bg:#1b1c1f;--surf:#242529;--raise:#2e3036;--line:#3a3c43;--text:#e7e7ea;--mute:#9b9da6;--acc:#62c4d9;--ok:#6fcf97;--bad:#f2806f;color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font:14px/1.45 "Segoe UI",system-ui,-apple-system,sans-serif}
#app{height:100%;display:flex;flex-direction:column}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
#tabs{display:flex;align-items:flex-end;gap:2px;padding:6px 8px 0;background:#141517;overflow-x:auto;flex:none}
.tab{display:flex;align-items:center;min-width:110px;max-width:220px;flex:0 1 200px;background:transparent;border-radius:8px 8px 0 0;border:1px solid transparent;border-bottom:0}
.tab:hover{background:#1f2023}
.tab.on{background:var(--surf);border-color:var(--line)}
.tab .t{flex:1;min-width:0;padding:7px 4px 7px 12px;background:none;border:0;text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--mute)}
.tab.on .t{color:var(--text)}
.x,.nb{background:none;border:0;border-radius:6px;color:var(--mute)}
.x{width:24px;height:24px;margin-right:4px;line-height:1}
.x:hover,.nb:hover:not(:disabled){background:var(--raise);color:var(--text)}
#newtab{width:30px;height:30px;margin:0 0 3px 4px;font-size:18px;flex:none}
#toolbar{display:flex;gap:6px;align-items:center;padding:8px;background:var(--surf);border-bottom:1px solid var(--line);flex:none}
.nb{width:34px;height:34px;font-size:17px;flex:none}
.nb:disabled{opacity:.35;cursor:default}
#go{flex:1;display:flex;gap:6px;min-width:0}
#url{flex:1;min-width:0;height:36px;padding:0 14px;background:var(--bg);border:1px solid var(--line);border-radius:18px}
#url:focus{border-color:var(--acc);outline:none}
#gobtn{height:36px;padding:0 16px;border-radius:18px;border:0;background:var(--acc);color:#0e1a1d;font-weight:600}
#bar{height:2px;background:transparent;overflow:hidden;flex:none}
#bar.on::after{content:"";display:block;height:100%;width:30%;background:var(--acc);animation:slide 1s ease-in-out infinite}
@keyframes slide{from{margin-left:-30%}to{margin-left:100%}}
@keyframes spin{to{transform:rotate(360deg)}}
#reload.spin span{display:inline-block;animation:spin 1s linear infinite}
@media (prefers-reduced-motion:reduce){#bar.on::after,#reload.spin span{animation-duration:3s}}
#viewer{flex:1;overflow:auto;min-height:0}
#status{display:flex;justify-content:space-between;gap:12px;padding:4px 12px;background:#141517;border-top:1px solid var(--line);color:var(--mute);font-size:12px;flex:none}
#st{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#code.ok{color:var(--ok)}#code.bad{color:var(--bad)}
.doc{padding:20px;max-width:1000px;margin:0 auto}
.code{margin:0;padding:16px;background:var(--surf);border:1px solid var(--line);border-radius:8px;overflow:auto;font:13px/1.55 ui-monospace,Consolas,monospace;white-space:pre-wrap;overflow-wrap:anywhere}
.k{color:var(--acc)}.s{color:#c3e88d}.n{color:#f7c67f}.b{color:#c792ea}
.home{max-width:640px;margin:0 auto;padding:9vh 20px 40px}
.home h1{font-size:30px;margin:0 0 6px;letter-spacing:-.02em}
.sub{color:var(--mute);margin:0 0 22px}
.hq{display:flex;gap:8px;margin-bottom:22px}
.hq input{flex:1;min-width:0;height:44px;padding:0 16px;background:var(--surf);border:1px solid var(--line);border-radius:22px}
.hq input:focus{border-color:var(--acc);outline:none}
.hq button{padding:0 20px;border:0;border-radius:22px;background:var(--acc);color:#0e1a1d;font-weight:600}
.shortcuts{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:8px}
.sc{display:flex;flex-direction:column;gap:2px;padding:10px 12px;text-align:left;background:var(--surf);border:1px solid var(--line);border-radius:8px}
.sc:hover{border-color:var(--acc)}
.sc span{color:var(--mute);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
details{margin-top:26px;color:var(--mute)}
summary{cursor:pointer;color:var(--text)}
details ul{padding-left:20px}
.err{max-width:640px;margin:8vh auto 0;padding:0 20px}
.err h2{margin:0 0 8px;font-size:20px}
.err p{margin:0 0 14px}
.err .btns{display:flex;gap:8px;margin-top:14px}
.err .btns button{padding:7px 16px;border-radius:8px;border:1px solid var(--line);background:var(--raise)}
@media (max-width:640px){#home{display:none}.tab{min-width:90px}#gobtn{padding:0 12px}}
</style>
</head>
<body>
<div id="app">
  <div id="tabs" role="tablist" aria-label="Tabs"></div>
  <div id="toolbar">
    <button class="nb" id="back" aria-label="Back" title="Back (Alt+Left)">&#8592;</button>
    <button class="nb" id="fwd" aria-label="Forward" title="Forward (Alt+Right)">&#8594;</button>
    <button class="nb" id="reload" aria-label="Reload" title="Reload"><span>&#8635;</span></button>
    <button class="nb" id="home" aria-label="Home" title="Home">&#8962;</button>
    <form id="go" autocomplete="off">
      <input id="url" type="text" aria-label="Address or search" placeholder="Enter an https:// address or search (Ctrl+L)" spellcheck="false">
      <button id="gobtn" type="submit">Go</button>
    </form>
  </div>
  <div id="bar" role="progressbar" aria-label="Loading"></div>
  <main id="viewer" tabindex="-1"></main>
  <footer id="status" aria-live="polite"><span id="st"></span><span id="code"></span></footer>
</div>
<noscript>This browser UI needs JavaScript.</noscript>
<script>
"use strict";
/* ---------- Configuration ---------- */
const PROXY_URL = "https://processors-personal-consist-racial.trycloudflare.com"; // no trailing slash
const SEARCH_TEMPLATE = "https://duckduckgo.com/html/?q={q}"; // {q} = encoded query
const TIMEOUT_MS = 12000;
const HOME = "about:home";
const SHORTCUTS = [
  {label:"GitHub Zen", url:"https://api.github.com/zen"},
  {label:"GitHub user (JSON)", url:"https://api.github.com/users/octocat"},
  {label:"Sample post (JSON)", url:"https://jsonplaceholder.typicode.com/posts/1"},
  {label:"JSONPlaceholder site (HTML)", url:"https://jsonplaceholder.typicode.com/"}
];

/* ---------- Helpers ---------- */
const $ = s => document.querySelector(s);
function el(tag, props = {}, ...kids) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(props)) {
    if (k === "class") e.className = v;
    else if (k.startsWith("on")) e.addEventListener(k.slice(2), v);
    else e.setAttribute(k, v);
  }
  e.append(...kids);
  return e;
}
const hostOf = u => { try { return new URL(u).host; } catch { return u; } };
const kb = n => n < 1024 ? n + " B" : (n / 1024).toFixed(1) + " KB";

/* ---------- State ---------- */
let tabs = [], activeId = null, nextId = 1;
const active = () => tabs.find(t => t.id === activeId);

function newTab(input) {
  const t = {id: nextId++, history: [{url: HOME, title: "New tab"}], index: 0, view: {kind: "home"},
    shown: "", title: "New tab", loading: false, ctrl: null, token: 0, status: {text: "Ready"}, lastAttempt: null, scroll: 0};
  tabs.push(t);
  switchTab(t.id);
  if (input) navigate(t, input); else $("#url").focus();
}
function switchTab(id) {
  const cur = active();
  if (cur) cur.scroll = $("#viewer").scrollTop;
  activeId = id;
  paint(true);
  $("#viewer").scrollTop = active().scroll || 0;
}
function closeTab(id) {
  const i = tabs.findIndex(t => t.id === id);
  if (i < 0) return;
  tabs[i].ctrl?.abort(); tabs[i].token++;
  tabs.splice(i, 1);
  if (!tabs.length) return newTab();
  if (activeId === id) activeId = tabs[Math.min(i, tabs.length - 1)].id;
  paint(true);
}

/* ---------- Input handling ---------- */
function resolveInput(raw) {
  const s = raw.trim();
  if (!s) return {error: "Enter a URL or a search term."};
  if (s === HOME) return {home: true};
  if (/^[a-z][a-z0-9+.-]*:\/\//i.test(s)) {
    let u;
    try { u = new URL(s); } catch { return {error: "That address is not a valid URL."}; }
    if (u.protocol === "http:") { u.protocol = "https:"; return {url: u.href, upgraded: true}; }
    if (u.protocol !== "https:") return {error: "Only https:// addresses are supported (got " + u.protocol + ")."};
    return {url: u.href};
  }
  if (!/\s/.test(s) && /^([^\s/]+\.[^\s/]+|localhost)/i.test(s)) {
    try { return {url: new URL("https://" + s).href}; } catch { /* fall through to search */ }
  }
  return {url: SEARCH_TEMPLATE.replace("{q}", encodeURIComponent(s)), isSearch: true};
}

function navigate(tab, input) {
  const r = resolveInput(input);
  if (r.error) return showError(tab, {title: "Can\u2019t open that address", message: r.error, url: input});
  if (r.home) {
    tab.ctrl?.abort(); tab.token++; tab.loading = false;
    tab.history.splice(tab.index + 1);
    tab.history.push({url: HOME, title: "New tab"}); tab.index++;
    return showHome(tab);
  }
  load(tab, r.url, {mode: "push", isSearch: r.isSearch, upgraded: r.upgraded});
}
function showHome(tab) {
  tab.view = {kind: "home"}; tab.shown = ""; tab.title = "New tab"; tab.status = {text: "Ready"}; tab.lastAttempt = null;
  if (tab === active()) paint(true);
}
function go(tab, delta) {
  const i = tab.index + delta;
  if (i < 0 || i >= tab.history.length) return;
  const e = tab.history[i];
  if (e.url === HOME) { tab.ctrl?.abort(); tab.token++; tab.loading = false; tab.index = i; return showHome(tab); }
  load(tab, e.url, {mode: "go", target: i});
}
function reload(tab) {
  if (tab.view.kind === "error" && tab.lastAttempt) return load(tab, tab.lastAttempt.url, tab.lastAttempt.opts);
  const e = tab.history[tab.index];
  if (e.url === HOME) return showHome(tab);
  load(tab, e.url, {mode: "reload"});
}

/* ---------- Loading ---------- */
function showError(tab, d) {
  tab.view = {kind: "error", ...d};
  tab.shown = d.url || tab.shown;
  tab.title = d.title.length > 28 ? "Error" : d.title;
  tab.status = {text: d.message, code: d.code, bad: true};
  if (tab === active()) paint(true);
}

function explain(code, host, isSearch) {
  if (isSearch) return "The search provider (" + host + ") could not be reached through your proxy. Its hostname allowlist probably does not include it. Add the host to the allowlist on your server, or change SEARCH_TEMPLATE to a provider the proxy allows.";
  switch (code) {
    case 400: return "The proxy rejected the request. It only accepts valid https:// URLs.";
    case 403: return host + " is probably not on the proxy\u2019s hostname allowlist, or the proxy refused this page\u2019s origin.";
    case 404: return "The page was not found, or the proxy has no /proxy route at this address.";
    case 429: return "The proxy\u2019s rate limit (30 requests per minute) was reached. Wait a moment and retry.";
    case 502: case 504: return "The proxy could not get a response from " + host + " (it may be down or slower than the proxy\u2019s 10-second timeout).";
    default: return code >= 500 ? "The proxy or the upstream server reported an error." : "The request was not successful.";
  }
}

async function load(tab, url, opts) {
  tab.ctrl?.abort();
  const ctrl = new AbortController(), token = ++tab.token, host = hostOf(url);
  tab.ctrl = ctrl; tab.loading = true; tab.shown = url; tab.lastAttempt = {url, opts};
  tab.status = {text: "Loading " + host + "\u2026"};
  if (tab === active()) paint();
  let timedOut = false;
  const timer = setTimeout(() => { timedOut = true; ctrl.abort(); }, TIMEOUT_MS);
  try {
    const res = await fetch(PROXY_URL + "/proxy?url=" + encodeURIComponent(url), {signal: ctrl.signal});
    const type = res.headers.get("content-type") || "";
    const body = await res.text();
    if (token !== tab.token) return;
    if (!res.ok) {
      return showError(tab, {title: "HTTP " + res.status, code: res.status, url,
        message: explain(res.status, host, opts.isSearch), detail: body.slice(0, 600)});
    }
    const view = buildView(url, type, body);
    const entry = {url, title: view.title};
    if (opts.mode === "push") { tab.history.splice(tab.index + 1); tab.history.push(entry); tab.index++; }
    else if (opts.mode === "go") { tab.index = opts.target; tab.history[tab.index] = entry; }
    else tab.history[tab.index] = entry;
    tab.view = view; tab.title = view.title; tab.lastAttempt = null;
    tab.status = {text: [host, type.split(";")[0] || "unknown type", kb(body.length), view.note, opts.upgraded ? "upgraded from http" : ""].filter(Boolean).join(" \u2013 "),
      code: res.status + " " + (res.statusText || "OK"), ok: true};
    if (tab === active()) paint(true);
  } catch (e) {
    if (token !== tab.token) return; // superseded by a newer navigation
    if (timedOut) showError(tab, {title: "Request timed out", url, message: "No answer from the proxy within " + TIMEOUT_MS / 1000 + " seconds."});
    else showError(tab, {title: "Proxy unreachable", url, message: "Could not reach the proxy. It may be offline, the Cloudflare quick-tunnel URL may have changed since it was restarted, or the proxy refused this page\u2019s origin (CORS).", detail: String(e && e.message || e)});
  } finally {
    clearTimeout(timer);
    if (token === tab.token) { tab.loading = false; tab.ctrl = null; if (tab === active()) paint(); }
  }
}

/* ---------- Content handling ---------- */
function buildView(url, type, body) {
  const t = type.toLowerCase(), host = hostOf(url);
  if (t.includes("json")) {
    try { return {kind: "json", text: JSON.stringify(JSON.parse(body), null, 2), title: host + new URL(url).pathname}; }
    catch { return {kind: "text", text: body, title: host, note: "invalid JSON shown as text"}; }
  }
  if (t.includes("html")) return buildHtml(url, body);
  if (t === "" || t.startsWith("text/") || t.includes("xml") || t.includes("javascript")) return {kind: "text", text: body, title: host + new URL(url).pathname};
  return {kind: "unsupported", type, title: host, url};
}

const ALLOWED = new Set("a abbr article aside b blockquote br caption cite code dd del details dfn div dl dt em figcaption figure footer h1 h2 h3 h4 h5 h6 header hr i kbd li main mark nav ol p pre q s samp section small span strong sub summary sup table tbody td tfoot th thead time tr u ul".split(" "));
const DROPPED = new Set("script style iframe frame frameset object embed noscript template svg math canvas audio video source track form head title link meta select textarea button input base applet".split(" "));
const MAX_NODES = 40000;

function safeHref(h, base) {
  if (!h || h.trim().startsWith("#")) return null;
  try { const u = new URL(h, base); return (u.protocol === "http:" || u.protocol === "https:") ? u.href : null; } catch { return null; }
}
// Copies only allow-listed elements and attributes into new nodes; nothing from upstream is ever inserted as markup.
function clean(src, out, ctx) {
  for (const n of src.childNodes) {
    if (ctx.count++ > MAX_NODES) { ctx.truncated = true; return; }
    if (n.nodeType === 3) { out.append(n.nodeValue); continue; }
    if (n.nodeType !== 1) continue;
    const t = n.localName;
    if (t === "img" || t === "picture") { ctx.images++; const alt = t === "img" && n.getAttribute("alt"); if (alt) out.append(el("span", {class: "img"}, "[image: " + alt.slice(0, 120) + "]")); continue; }
    if (DROPPED.has(t)) { ctx.removed++; continue; }
    if (!ALLOWED.has(t)) { clean(n, out, ctx); continue; } // unknown wrapper (html, body, font, label...): keep its children
    const e = document.createElement(t);
    if (t === "a") {
      const h = safeHref(n.getAttribute("href"), ctx.base);
      if (h) { e.dataset.href = h; e.tabIndex = 0; e.setAttribute("role", "link"); e.title = h; }
    }
    if (t === "td" || t === "th") for (const a of ["colspan", "rowspan"]) { const v = parseInt(n.getAttribute(a), 10); if (v > 0 && v <= 50) e.setAttribute(a, v); }
    clean(n, e, ctx);
    out.append(e);
  }
}
function buildHtml(url, body) {
  const doc = new DOMParser().parseFromString(body, "text/html"); // inert: no scripts run, no resources load
  const ctx = {base: url, count: 0, images: 0, removed: 0, truncated: false};
  const article = el("article");
  clean(doc.body || doc.documentElement, article, ctx);
  const title = (doc.title || "").trim().slice(0, 80) || hostOf(url);
  const note = ["removed " + ctx.removed + " script/style/embed elements", ctx.images + " images not loaded", ctx.truncated ? "page truncated" : ""].join(", ");
  return {kind: "html", node: article, title, note};
}

const PAGE_CSS = `
:host{display:block}
article{font:16px/1.65 system-ui,"Segoe UI",sans-serif;color:#e7e7ea;max-width:80ch;margin:0 auto;padding:24px 20px 72px;overflow-wrap:anywhere}
h1,h2,h3,h4,h5,h6{line-height:1.25;margin:1.4em 0 .5em}
a[data-href]{color:#62c4d9;text-decoration:underline;cursor:pointer}
a[data-href]:focus-visible{outline:2px solid #62c4d9;outline-offset:2px}
pre,code,kbd,samp{font-family:ui-monospace,Consolas,monospace;font-size:.9em;background:#242529;border-radius:4px}
code{padding:1px 4px}
pre{padding:12px;overflow:auto;border:1px solid #3a3c43;border-radius:8px}
pre code{padding:0}
blockquote{border-left:3px solid #3a3c43;margin:1em 0;padding-left:1em;color:#9b9da6}
table{border-collapse:collapse;display:block;overflow:auto;max-width:100%}
td,th{border:1px solid #3a3c43;padding:4px 10px;text-align:left}
hr{border:0;border-top:1px solid #3a3c43}
.img{color:#9b9da6;font-style:italic}`;

/* ---------- Views ---------- */
function onLink(e) {
  const a = e.target.closest && e.target.closest("[data-href]");
  if (!a || (e.type === "keydown" && e.key !== "Enter")) return;
  e.preventDefault();
  navigate(active(), a.dataset.href);
}
const views = {
  home(box) {
    const input = el("input", {id: "hq", type: "text", "aria-label": "Search or enter an address", placeholder: "Search or enter an https:// address"});
    box.append(el("section", {class: "home"},
      el("h1", {}, "Proxy Browser"),
      el("p", {class: "sub"}, "Pages load through your own proxy, so only hosts on its allowlist will open."),
      el("form", {class: "hq", autocomplete: "off", onsubmit: e => { e.preventDefault(); navigate(active(), input.value); }}, input, el("button", {type: "submit"}, "Search")),
      el("div", {class: "shortcuts"}, ...SHORTCUTS.map(s => el("button", {type: "button", class: "sc", onclick: () => navigate(active(), s.url)}, el("b", {}, s.label), el("span", {}, s.url.replace("https://", ""))))),
      el("details", {}, el("summary", {}, "What this browser can and can\u2019t do"),
        el("ul", {},
          el("li", {}, "HTML is parsed, then rebuilt from an allow-list of text, link and table elements inside a closed shadow root."),
          el("li", {}, "Scripts, site CSS, images, media, forms and embeds are removed, so most modern sites will look plain or incomplete."),
          el("li", {}, "No cookies, logins or JavaScript-driven pages. Links open through the proxy."),
          el("li", {}, "Search needs a provider your proxy allows; the default is not on the current allowlist.")))));
    if (!matchMedia("(hover:none)").matches) input.focus();
  },
  json(box, v) {
    const pre = el("pre", {class: "code"}), s = v.text;
    if (s.length > 300000) pre.textContent = s;
    else {
      const re = /("(?:\\.|[^"\\])*"(\s*:)?|\b(?:true|false|null)\b|-?\d+(?:\.\d+)?(?:[eE][+-]?\d+)?)/g;
      let last = 0, m;
      while ((m = re.exec(s))) {
        if (m.index > last) pre.append(s.slice(last, m.index));
        const tok = m[0], cls = m[2] ? "k" : tok[0] === '"' ? "s" : /^(true|false|null)$/.test(tok) ? "b" : "n";
        pre.append(el("span", {class: cls}, tok));
        last = re.lastIndex;
      }
      pre.append(s.slice(last));
    }
    box.append(el("div", {class: "doc"}, pre));
  },
  text(box, v) { box.append(el("div", {class: "doc"}, el("pre", {class: "code", textContent: v.text}))); },
  html(box, v) {
    const host = el("div"), root = host.attachShadow({mode: "closed"});
    root.append(el("style", {}, PAGE_CSS), v.node);
    root.addEventListener("click", onLink);
    root.addEventListener("keydown", onLink);
    box.append(host);
  },
  unsupported(box, v) {
    box.append(el("section", {class: "err"}, el("h2", {}, "Can\u2019t display this content type"),
      el("p", {}, "The proxy returned \u201c" + (v.type || "unknown") + "\u201d. Only HTML, JSON and text are rendered.")));
  },
  error(box, v) {
    const btns = el("div", {class: "btns"});
    if (active().lastAttempt) btns.append(el("button", {type: "button", onclick: () => reload(active())}, "Try again"));
    btns.append(el("button", {type: "button", onclick: () => navigate(active(), HOME)}, "Go to home"));
    box.append(el("section", {class: "err"}, el("h2", {}, v.title), el("p", {}, v.message),
      v.url ? el("p", {class: "sub"}, v.url) : "", v.detail ? el("pre", {class: "code", textContent: v.detail}) : "", btns));
  }
};

/* ---------- Chrome ---------- */
function paint(viewToo) {
  const t = active();
  // tabs
  const f = document.activeElement && document.activeElement.dataset.f;
  const strip = $("#tabs");
  strip.replaceChildren(...tabs.map(x => el("div", {class: "tab" + (x.id === activeId ? " on" : ""), role: "presentation"},
    el("button", {class: "t", role: "tab", "aria-selected": x.id === activeId, "data-f": "t" + x.id, title: x.title, onclick: () => switchTab(x.id)}, x.title),
    el("button", {class: "x", "aria-label": "Close tab: " + x.title, "data-f": "x" + x.id, onclick: () => closeTab(x.id)}, "\u00d7"))),
    el("button", {class: "nb", id: "newtab", "aria-label": "New tab", title: "New tab", "data-f": "n", onclick: () => newTab()}, "+"));
  if (f) strip.querySelector('[data-f="' + f + '"]')?.focus();
  // toolbar
  $("#back").disabled = t.index <= 0;
  $("#fwd").disabled = t.index >= t.history.length - 1;
  $("#reload").classList.toggle("spin", t.loading);
  $("#bar").classList.toggle("on", t.loading);
  $("#bar").setAttribute("aria-hidden", !t.loading);
  if (document.activeElement !== $("#url") || viewToo) $("#url").value = t.shown;
  $("#st").textContent = t.status.text || "";
  const c = $("#code");
  c.textContent = t.status.code || "";
  c.className = t.status.ok ? "ok" : t.status.bad ? "bad" : "";
  document.title = (t.title || "New tab") + " \u2013 Proxy Browser";
  if (viewToo) {
    const box = $("#viewer");
    box.replaceChildren(); box.scrollTop = 0;
    views[t.view.kind](box, t.view);
  }
}

/* ---------- Wiring ---------- */
$("#go").addEventListener("submit", e => { e.preventDefault(); navigate(active(), $("#url").value); $("#viewer").focus(); });
$("#back").addEventListener("click", () => go(active(), -1));
$("#fwd").addEventListener("click", () => go(active(), 1));
$("#reload").addEventListener("click", () => reload(active()));
$("#home").addEventListener("click", () => navigate(active(), HOME));
$("#url").addEventListener("focus", e => e.target.select());
$("#url").addEventListener("keydown", e => { if (e.key === "Escape") { e.target.value = active().shown; e.target.blur(); } });
document.addEventListener("keydown", e => {
  if (e.ctrlKey && e.key.toLowerCase() === "l") { e.preventDefault(); $("#url").focus(); }
  else if (e.altKey && e.key === "ArrowLeft") { e.preventDefault(); go(active(), -1); }
  else if (e.altKey && e.key === "ArrowRight") { e.preventDefault(); go(active(), 1); }
});
newTab();
</script>
</body>
</html>
