<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Proxy Browser</title>
<style>
:root{--bg:#1b1c1f;--surf:#242529;--raise:#2e3036;--line:#3a3c43;--text:#e7e7ea;--mute:#9b9da6;--acc:#62c4d9;--ok:#6fcf97;--bad:#f2806f;color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font:14px/1.45 "Segoe UI",system-ui,-apple-system,sans-serif}
#app{height:100%;display:flex;flex-direction:column}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
#tabs{display:flex;align-items:flex-end;gap:2px;padding:6px 8px 0;background:#141517;overflow-x:auto;flex:none}
.tab{display:flex;align-items:center;min-width:110px;max-width:220px;flex:0 1 200px;border-radius:8px 8px 0 0;border:1px solid transparent;border-bottom:0}
.tab:hover{background:#1f2023}
.tab.on{background:var(--surf);border-color:var(--line)}
.tab .t{flex:1;min-width:0;padding:7px 4px 7px 12px;background:none;border:0;text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--mute)}
.tab.on .t{color:var(--text)}
.x,.nb{background:none;border:0;border-radius:6px;color:var(--mute)}
.x{width:24px;height:24px;margin-right:4px;line-height:1}
.x:hover,.nb:hover:not(:disabled){background:var(--raise);color:var(--text)}
#newtab{width:30px;height:30px;margin:0 0 3px 4px;font-size:18px;flex:none}
#toolbar{display:flex;gap:6px;align-items:center;padding:8px;background:var(--surf);border-bottom:1px solid var(--line);flex:none}
.nb{width:34px;height:34px;font-size:17px;flex:none}
.nb:disabled{opacity:.35;cursor:default}
#go{flex:1;display:flex;gap:6px;min-width:0}
#url{flex:1;min-width:0;height:36px;padding:0 14px;background:var(--bg);border:1px solid var(--line);border-radius:18px}
#url:focus{border-color:var(--acc);outline:none}
#gobtn{height:36px;padding:0 16px;border-radius:18px;border:0;background:var(--acc);color:#0e1a1d;font-weight:600}
#bar{height:2px;overflow:hidden;flex:none}
#bar.on::after{content:"";display:block;height:100%;width:30%;background:var(--acc);animation:slide 1s ease-in-out infinite}
@keyframes slide{from{margin-left:-30%}to{margin-left:100%}}
@media (prefers-reduced-motion:reduce){#bar.on::after{animation-duration:3s}}
#viewer{flex:1;overflow:auto;min-height:0;position:relative}
.page{position:absolute;inset:0;width:100%;height:100%;border:0;background:#fff}
#status{display:flex;justify-content:space-between;gap:12px;padding:4px 12px;background:#141517;border-top:1px solid var(--line);color:var(--mute);font-size:12px;flex:none}
#st{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#code.ok{color:var(--ok)}#code.bad{color:var(--bad)}
.doc{padding:20px;max-width:1000px;margin:0 auto}
.code{margin:0;padding:16px;background:var(--surf);border:1px solid var(--line);border-radius:8px;overflow:auto;font:13px/1.55 ui-monospace,Consolas,monospace;white-space:pre-wrap;overflow-wrap:anywhere}
.k{color:var(--acc)}.s{color:#c3e88d}.n{color:#f7c67f}.b{color:#c792ea}
.home{max-width:640px;margin:0 auto;padding:9vh 20px 40px}
.home h1{font-size:30px;margin:0 0 6px;letter-spacing:-.02em}
.sub{color:var(--mute);margin:0 0 22px}
.hq{display:flex;gap:8px;margin-bottom:22px}
.hq input{flex:1;min-width:0;height:44px;padding:0 16px;background:var(--surf);border:1px solid var(--line);border-radius:22px}
.hq input:focus{border-color:var(--acc);outline:none}
.hq button{padding:0 20px;border:0;border-radius:22px;background:var(--acc);color:#0e1a1d;font-weight:600}
.shortcuts{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:8px}
.sc{display:flex;flex-direction:column;gap:2px;padding:10px 12px;text-align:left;background:var(--surf);border:1px solid var(--line);border-radius:8px}
.sc:hover{border-color:var(--acc)}
.sc span{color:var(--mute);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
details{margin-top:26px;color:var(--mute)}
summary{cursor:pointer;color:var(--text)}
details ul{padding-left:20px}
.err{max-width:640px;margin:8vh auto 0;padding:0 20px}
.err h2{margin:0 0 8px;font-size:20px}
.err p{margin:0 0 14px}
.err .btns{display:flex;gap:8px;margin-top:14px}
.err .btns button{padding:7px 16px;border-radius:8px;border:1px solid var(--line);background:var(--raise)}
@media (max-width:640px){#home{display:none}.tab{min-width:90px}#gobtn{padding:0 12px}}
</style>
</head>
<body>
<div id="app">
  <div id="tabs" role="tablist" aria-label="Tabs"></div>
  <div id="toolbar">
    <button class="nb" id="back" aria-label="Back" title="Back (Alt+Left)">&#8592;</button>
    <button class="nb" id="fwd" aria-label="Forward" title="Forward (Alt+Right)">&#8594;</button>
    <button class="nb" id="reload" aria-label="Reload" title="Reload">&#8635;</button>
    <button class="nb" id="home" aria-label="Home" title="Home">&#8962;</button>
    <form id="go" autocomplete="off">
      <input id="url" type="text" aria-label="Address or search" placeholder="Enter an https:// address or search (Ctrl+L)" spellcheck="false">
      <button id="gobtn" type="submit">Go</button>
    </form>
  </div>
  <div id="bar" role="progressbar" aria-label="Loading"></div>
  <main id="viewer" tabindex="-1"></main>
  <footer id="status" aria-live="polite"><span id="st"></span><span id="code"></span></footer>
</div>
<noscript>This browser UI needs JavaScript.</noscript>

// false: pages can only use images/fonts this browser inlined itself (private; dynamically added images stay blank).
// true: pages may load images and fonts straight from their own sites (thumbnails appear, but those sites see your IP).
const DIRECT_MEDIA = false;
const CSP = "default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:" + (DIRECT_MEDIA ? " https:" : "") + "; font-src data:" + (DIRECT_MEDIA ? " https:" : "") + "; media-src data:";

async function buildPage(url, body, signal) {
  const doc = new DOMParser().parseFromString(body, "text/html"); // inert while parsing
  const abs = v => { try { const u = new URL(v, url); return u.protocol === "https:" || u.protocol === "http:" ? u.href : null; } catch { return null; } };
  doc.querySelectorAll("base,iframe,frame,object,embed,noscript,meta[http-equiv],link:not([rel~=stylesheet]),picture source").forEach(n => n.remove());
  doc.querySelectorAll("a[href],area[href]").forEach(a => {
    a.removeAttribute("target");
    const h = a.getAttribute("href");
    if (h[0] !== "#") { const u = abs(h); if (u) a.setAttribute("href", u); else a.removeAttribute("href"); }
  });
  doc.querySelectorAll("img").forEach(i => { i.removeAttribute("srcset"); i.removeAttribute("sizes"); });
  const jobs = [];
  doc.querySelectorAll("link[rel~=stylesheet][href]").forEach(n => jobs.push({n, k: "css", u: abs(n.getAttribute("href"))}));
  doc.querySelectorAll("script[src]").forEach(n => jobs.push({n, k: "js", u: abs(n.getAttribute("src")), defer: n.hasAttribute("defer") && n.type !== "module"}));
  doc.querySelectorAll("img[src]").forEach(n => { if (!n.getAttribute("src").startsWith("data:")) jobs.push({n, k: "img", u: abs(n.getAttribute("src"))}); });
  const run = jobs.filter(j => j.u).slice(0, RESOURCE_LIMIT);
  let ok = 0;
  const drop = j => j.k === "img" ? j.n.removeAttribute("src") : j.n.remove();
  jobs.filter(j => !run.includes(j)).forEach(j => { console.warn("[proxy-browser] not loaded:", j.k, j.u || "(unsupported URL)"); drop(j); });
  await Promise.all(run.map(async j => {
    try {
      const r = await pfetch(j.u, signal, undefined, {headers: {Accept: ACC[j.k]}});
      if (!r.ok) throw new Error(r.status);
      if (j.k === "css") {
        const s = doc.createElement("style");
        s.textContent = (await r.text()).replace(/@import[^;]+;/g, "").replace(/<\/style/gi, "<\\/style");
        j.n.replaceWith(s);
      } else if (j.k === "js") {
        const txt = await r.text();
        for (const a of ["src", "integrity", "crossorigin", "nonce"]) j.n.removeAttribute(a);
        j.n.textContent = txt.replace(/<\/script/gi, "<\\/script");
      } else {
        const buf = await r.arrayBuffer(), mt = (r.headers.get("content-type") || "").split(";")[0];
        if (!mt.startsWith("image/") || buf.byteLength > MAX_IMAGE_BYTES) throw new Error("skip");
        const b = new Uint8Array(buf); let s = "";
        for (let i = 0; i < b.length; i += 8192) s += String.fromCharCode.apply(null, b.subarray(i, i + 8192));
        j.n.setAttribute("src", "data:" + mt + ";base64," + btoa(s));
      }
      ok++;
    } catch (e) { if (signal.aborted) throw e; drop(j); }
  }));
  const shim = doc.createElement("script");
  shim.textContent = SHIM.replace("__P__", JSON.stringify(url).replace(/</g, "\\u003c"));
  const csp = doc.createElement("meta");
  csp.setAttribute("http-equiv", "Content-Security-Policy"); csp.setAttribute("content", CSP);
  const head = doc.head || doc.documentElement.insertBefore(doc.createElement("head"), doc.body);
  const base = doc.createElement("base"); base.setAttribute("href", url);
  head.prepend(shim); head.prepend(base); head.prepend(csp);
  const skipped = jobs.length - run.length;
  return {kind: "page", srcdoc: "<!doctype html>" + doc.documentElement.outerHTML, url,
    title: (doc.title || "").trim().slice(0, 80) || hostOf(url),
    note: ok + "/" + jobs.length + " resources loaded" + (skipped > 0 ? " (" + skipped + " over limit)" : "")};
}

/* ---------- Views ---------- */
const views = {
  home(box) {
    const input = el("input", {id: "hq", type: "text", "aria-label": "Search or enter an address", placeholder: "Search or enter an https:// address"});
    box.append(el("section", {class: "home"},
      el("h1", {}, "Proxy Browser"),
      el("p", {class: "sub"}, "Every page and file loads through your own proxy."),
      el("form", {class: "hq", autocomplete: "off", onsubmit: e => { e.preventDefault(); navigate(active(), input.value); }}, input, el("button", {type: "submit"}, "Search")),
      el("div", {class: "shortcuts"}, ...SHORTCUTS.map(s => el("button", {type: "button", class: "sc", onclick: () => navigate(active(), s.url)}, el("b", {}, s.label), el("span", {}, s.url.replace("https://", ""))))),
      el("details", {}, el("summary", {}, "How pages are rendered, and what won\u2019t work"),
        el("ul", {},
          el("li", {}, "HTML runs in a sandboxed frame with its own isolated origin. It can\u2019t touch this UI, your cookies or storage."),
          el("li", {}, "CSS, scripts and images are fetched through the proxy and inlined. Only the first " + RESOURCE_LIMIT + " per page are loaded."),
          el("li", {}, "Page scripts can\u2019t reach the network directly. fetch() calls (text bodies only) are relayed through the proxy; XMLHttpRequest, WebSockets and streaming are not."),
          el("li", {}, "Script-heavy sites that rely on XMLHttpRequest, WebSockets, video streaming or document.cookie, such as YouTube, will still be incomplete or broken."),
          el("li", {}, "Cookies that sites set are kept in this browser\u2019s localStorage and sent back through the proxy. Page scripts can\u2019t read or set them. Links and GET forms navigate through the proxy.")))));
    if (!matchMedia("(hover:none)").matches) input.focus();
  },
  json(box, v) {
    const pre = el("pre", {class: "code"}), s = v.text;
    if (s.length > 300000) pre.textContent = s;
    else {
      const re = /("(?:\\.|[^"\\])*"(\s*:)?|\b(?:true|false|null)\b|-?\d+(?:\.\d+)?(?:[eE][+-]?\d+)?)/g;
      let last = 0, m;
      while ((m = re.exec(s))) {
        if (m.index > last) pre.append(s.slice(last, m.index));
        const tok = m[0], cls = m[2] ? "k" : tok[0] === '"' ? "s" : /^(true|false|null)$/.test(tok) ? "b" : "n";
        pre.append(el("span", {class: cls}, tok));
        last = re.lastIndex;
      }
      pre.append(s.slice(last));
    }
    box.append(el("div", {class: "doc"}, pre));
  },
  text(box, v) { box.append(el("div", {class: "doc"}, el("pre", {class: "code", textContent: v.text}))); },
  page(box, v) {
    // allow-scripts WITHOUT allow-same-origin: scripts run, but in an opaque origin with no access to this page.
    const fr = el("iframe", {class: "page", sandbox: "allow-scripts", referrerpolicy: "no-referrer", title: v.title, srcdoc: v.srcdoc});
    let loads = 0, blocked = 0;
    fr.addEventListener("load", () => { // a second load means the page navigated its own frame away from the proxied copy
      if (++loads < 2) return;
      loads = 0;
      const t = active();
      if (++blocked > 2) { // it keeps doing it: stop reloading
        fr.remove();
        t.status = {text: "This page keeps redirecting its own frame, so loading was stopped.", bad: true};
        box.append(el("section", {class: "err"}, el("h2", {}, "Page stopped"),
          el("p", {}, "Its scripts kept trying to send the page frame to a live site, which this browser blocks. The site probably needs a redirect or cookie this setup can\u2019t provide.")));
      } else { fr.srcdoc = v.srcdoc; t.status = {text: "Blocked a page script from navigating the frame directly.", bad: true}; }
      paint();
    });
    box.append(fr);
  },
  unsupported(box, v) {
    box.append(el("section", {class: "err"}, el("h2", {}, "Can\u2019t display this content type"),
      el("p", {}, "The proxy returned \u201c" + (v.type || "unknown") + "\u201d. Only HTML, JSON and text are rendered.")));
  },
  error(box, v) {
    const btns = el("div", {class: "btns"});
    if (active().lastAttempt) btns.append(el("button", {type: "button", onclick: () => reload(active())}, "Try again"));
    btns.append(el("button", {type: "button", onclick: () => navigate(active(), HOME)}, "Go to home"));
    box.append(el("section", {class: "err"}, el("h2", {}, v.title), el("p", {}, v.message),
      v.url ? el("p", {class: "sub"}, v.url) : "", v.detail ? el("pre", {class: "code", textContent: v.detail}) : "", btns));
  }
};

/* Messages from the sandboxed frame: only the current frame is trusted, and only for these three requests. */
addEventListener("message", async e => {
  const fr = $("#viewer iframe"), t = active();
  if (!fr || e.source !== fr.contentWindow) return;
  const d = e.data || {};
  if (d.t === "nav" && typeof d.url === "string") navigate(t, d.url);
  else if (d.t === "msg" && typeof d.text === "string") { t.status = {text: d.text.slice(0, 200)}; paint(); }
  else if (d.t === "fetch" && typeof d.url === "string" && typeof d.id === "number") {
    try {
      if (!d.url.startsWith("https://")) throw new Error("Only https:// requests are allowed");
      const m = String(d.method || "GET").toUpperCase();
      if (!["GET", "HEAD", "POST", "PUT", "PATCH", "DELETE"].includes(m)) throw new Error("Method not allowed");
      const headers = {};
      for (const [k, v] of Object.entries(d.headers || {}).slice(0, 40)) if (typeof v === "string" && v.length < 4000 && /^[\w-]+$/.test(k) && !/^(cookie|host|origin|referer|user-agent|x-proxy-.*)$/i.test(k)) headers[k] = v;
      const r = await pfetch(d.url, t.ctrl && t.ctrl.signal, undefined, {method: m, headers, body: m === "GET" || m === "HEAD" || typeof d.body !== "string" ? undefined : d.body});
      const body = await r.arrayBuffer();
      e.source.postMessage({id: d.id, status: r.status, type: r.headers.get("content-type") || "", body}, "*");
    } catch (err) { e.source.postMessage({id: d.id, err: "Request failed: " + (err.message || err)}, "*"); }
  }
});

/* ---------- Chrome ---------- */
function paint(viewToo) {
  const t = active();
  const f = document.activeElement && document.activeElement.dataset.f;
  const strip = $("#tabs");
  strip.replaceChildren(...tabs.map(x => el("div", {class: "tab" + (x.id === activeId ? " on" : ""), role: "presentation"},
    el("button", {class: "t", role: "tab", "aria-selected": x.id === activeId, "data-f": "t" + x.id, title: x.title, onclick: () => switchTab(x.id)}, x.title),
    el("button", {class: "x", "aria-label": "Close tab: " + x.title, "data-f": "x" + x.id, onclick: () => closeTab(x.id)}, "\u00d7"))),
    el("button", {class: "nb", id: "newtab", "aria-label": "New tab", title: "New tab", "data-f": "n", onclick: () => newTab()}, "+"));
  if (f) strip.querySelector('[data-f="' + f + '"]')?.focus();
  $("#back").disabled = t.index <= 0;
  $("#fwd").disabled = t.index >= t.history.length - 1;
  const rl = $("#reload");
  rl.textContent = t.loading ? "\u2715" : "\u21bb";
  rl.setAttribute("aria-label", t.loading ? "Stop" : "Reload"); rl.title = t.loading ? "Stop" : "Reload";
  $("#bar").classList.toggle("on", t.loading);
  if (document.activeElement !== $("#url") || viewToo) $("#url").value = t.shown;
  $("#st").textContent = t.status.text || "";
  const c = $("#code");
  c.textContent = t.status.code || "";
  c.className = t.status.ok ? "ok" : t.status.bad ? "bad" : "";
  document.title = (t.title || "New tab") + " \u2013 Proxy Browser";
  if (viewToo) {
    const box = $("#viewer");
    box.replaceChildren(); box.scrollTop = 0;
    views[t.view.kind](box, t.view);
  }
}

/* ---------- Wiring ---------- */
$("#go").addEventListener("submit", e => { e.preventDefault(); navigate(active(), $("#url").value); $("#viewer").focus(); });
$("#back").addEventListener("click", () => go(active(), -1));
$("#fwd").addEventListener("click", () => go(active(), 1));
$("#reload").addEventListener("click", () => reload(active()));
$("#home").addEventListener("click", () => navigate(active(), HOME));
$("#url").addEventListener("focus", e => e.target.select());
$("#url").addEventListener("keydown", e => { if (e.key === "Escape") { e.target.value = active().shown; e.target.blur(); } });
document.addEventListener("keydown", e => {
  if (e.ctrlKey && e.key.toLowerCase() === "l") { e.preventDefault(); $("#url").focus(); }
  else if (e.altKey && e.key === "ArrowLeft") { e.preventDefault(); go(active(), -1); }
  else if (e.altKey && e.key === "ArrowRight") { e.preventDefault(); go(active(), 1); }
});
newTab();
